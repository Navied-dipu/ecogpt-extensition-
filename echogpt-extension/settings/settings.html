<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoGPT Settings</title>
    <link rel="stylesheet" href="../styles/common.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="settings app-shell">
      <header class="settings-header">
        <h1>Settings</h1>
        <button id="themeToggle" class="btn btn-ghost">◐ Theme</button>
      </header>

      <main class="settings-body">
        <section class="group">
          <h2 class="group-title">Appearance</h2>
          <label class="field">
            <span>Theme</span>
            <select id="themeSelect">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
        </section>

        <section class="group">
          <h2 class="group-title">Model</h2>
          <label class="field">
            <span>Temperature</span>
            <input id="temperature" type="number" min="0" max="2" step="0.1" />
          </label>
          <label class="field">
            <span>Max tokens</span>
            <input id="maxTokens" type="number" min="1" max="128000" step="256" />
          </label>
        </section>

        <section class="group">
          <h2 class="group-title">API Keys</h2>
          <p class="text-muted group-hint">Stored locally in your browser profile.</p>
          <label class="field">
            <span>OpenAI</span>
            <input id="keyChatgpt" type="password" placeholder="sk-..." autocomplete="off" />
          </label>
          <label class="field">
            <span>Anthropic</span>
            <input id="keyClaude" type="password" placeholder="sk-ant-..." autocomplete="off" />
          </label>
          <label class="field">
            <span>Google</span>
            <input id="keyGemini" type="password" placeholder="AIza..." autocomplete="off" />
          </label>
        </section>

        <div class="actions">
          <button id="save" class="btn btn-primary">Save changes</button>
          <button id="reset" class="btn">Reset</button>
        </div>
        <p id="status" class="status hidden">Saved</p>
      </main>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
