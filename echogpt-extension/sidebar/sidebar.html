<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoGPT Sidebar</title>
    <link rel="stylesheet" href="../styles/common.css" />
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <div class="sidebar">
      <!-- ===== Header (60px) ===== -->
      <header class="hdr">
        <div class="hdr__brand">
          <span class="hdr__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
              <path
                d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v7a2.5 2.5 0 0 1-2.5 2.5H9l-5 4v-13.5Z"
                fill="currentColor"
              />
              <path d="M8.5 7.5h7M8.5 10.5h4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </span>

          <div class="hdr__titles">
            <span class="hdr__app">EchoGPT</span>
            <h1
              class="hdr__title"
              id="chatTitle"
              contenteditable="plaintext-only"
              spellcheck="false"
              role="textbox"
              aria-label="Chat title"
              title="Click to rename"
            >New Chat</h1>
          </div>
        </div>

        <div class="hdr__actions">
          <button id="newChat" class="icon-btn" type="button" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <button id="openHistory" class="icon-btn" type="button" title="History" aria-label="History">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path
                d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 5v4.2h4.2"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 7.8V12l3 1.8"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button id="openSettings" class="icon-btn" type="button" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.7" />
              <path
                d="M19.4 13.8a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.2a1.9 1.9 0 1 1-3.8 0v-.1a1.6 1.6 0 0 0-2.8-1.1l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0-1.1-2.7h-.2a1.9 1.9 0 1 1 0-3.8h.1a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 2.7-1.1v-.2a1.9 1.9 0 1 1 3.8 0v.1a1.6 1.6 0 0 0 2.8 1.1l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.2a1.9 1.9 0 1 1 0 3.8h-.1a1.6 1.6 0 0 0-1.5 1Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button id="themeToggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none">
              <circle cx="12" cy="12" r="4.2" fill="currentColor" />
              <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2" />
                <path d="M5.2 5.2 6.8 6.8M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" />
              </g>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>

      <!-- ===== Model bar (48px) ===== -->
      <nav class="modelbar" aria-label="AI models">
        <div class="modelbar__track" id="modelTabs" role="tablist"></div>
        <span class="modelbar__indicator" id="modelIndicator" aria-hidden="true"></span>
      </nav>

      <!-- ===== Messages (flex-1) ===== -->
      <main class="messages" id="messages" aria-live="polite">
        <!-- Empty state -->
        <div class="empty" id="emptyState">
          <div class="empty__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none">
              <path
                d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v7a2.5 2.5 0 0 1-2.5 2.5H9l-5 4v-13.5Z"
                fill="url(#emptyGrad)"
              />
              <defs>
                <linearGradient id="emptyGrad" x1="0" y1="0" x2="24" y2="24">
                  <stop stop-color="#7c3aed" />
                  <stop offset="1" stop-color="#2563eb" />
                </linearGradient>
              </defs>
              <path d="M8.5 7.5h7M8.5 10.5h4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </div>
          <p class="empty__title">Ask me anything...</p>
          <p class="empty__sub">One sidebar, every model. Pick a tab and start.</p>

          <div class="chips">
            <button class="chip" type="button" data-suggest="Summarize this page">Summarize this page</button>
            <button class="chip" type="button" data-suggest="What is this about?">What is this about?</button>
            <button class="chip" type="button" data-suggest="Help me write">Help me write</button>
            <button class="chip" type="button" data-suggest="Explain selected text">Explain selected text</button>
          </div>
        </div>
      </main>

      <!-- Scroll FAB -->
      <button class="fab" id="scrollFab" type="button" title="Scroll to bottom" aria-label="Scroll to bottom" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
          <path d="M12 5v13M6 12.5 12 18.5l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <!-- ===== Composer (~120px) ===== -->
      <footer class="composer">
        <div class="action-badge" id="actionBadge" hidden>
          <span class="action-badge__pulse" aria-hidden="true"></span>
          <span class="action-badge__label" id="actionBadgeLabel">Quick Action</span>
        </div>

        <div class="composer__toolbar">
          <button
            id="contextToggle"
            class="pill"
            type="button"
            aria-pressed="false"
            title="Include the current page as context"
          >
            <span aria-hidden="true">🌐</span> Page
          </button>

          <button id="attach" class="icon-btn icon-btn--soft" type="button" title="Attach file" aria-label="Attach file">
            <span aria-hidden="true">📎</span>
          </button>
          <input id="fileInput" type="file" multiple hidden />

          <div class="attachments" id="attachments"></div>

          <span class="counter" id="counter">0/4000</span>
          <span class="token-counter" id="tokenCounter" title="Estimated tokens"></span>
        </div>

        <div class="composer__row">
          <textarea
            id="input"
            class="composer__input"
            rows="1"
            maxlength="4000"
            placeholder="Message EchoGPT..."
            aria-label="Message"
          ></textarea>

          <button id="send" class="sendbtn" type="button" disabled aria-label="Send message">
            <svg class="sendbtn__send" viewBox="0 0 24 24" width="17" height="17" fill="none">
              <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="sendbtn__spinner" aria-hidden="true"></span>
            <span class="sendbtn__stop" aria-hidden="true"></span>
          </button>
        </div>

        <p class="composer__hint">Enter to send &middot; Shift+Enter for new line</p>
      </footer>
    </div>

    <!-- Sign-in overlay -->
    <div class="sign-in-overlay" id="signInOverlay" hidden>
      <div class="sign-in-card">
        <div class="sign-in-card__logo">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v7a2.5 2.5 0 0 1-2.5 2.5H9l-5 4v-13.5Z" fill="url(#siGrad)"/>
            <defs>
              <linearGradient id="siGrad" x1="0" y1="0" x2="24" y2="24">
                <stop stop-color="#7c3aed"/>
                <stop offset="1" stop-color="#2563eb"/>
              </linearGradient>
            </defs>
            <path d="M8.5 7.5h7M8.5 10.5h4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <h2 class="sign-in-card__title">Sign in to EchoGPT</h2>
        <p class="sign-in-card__sub">Add your API token in Settings to start chatting with AI models.</p>
        <button class="btn btn-primary" id="signInBtn" type="button">Go to Settings</button>
      </div>
    </div>

    <script src="sidebar.js"></script>
  </body>
</html>
